<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you | dispatch.</title>
<meta name="description" content="dispatch. is an independent franchise marketing agency. We plan, create and run multi-location marketing that holds together at the brand level and works locally.">
<meta property="og:title" content="dispatch. | Franchise &amp; Multi-Location Marketing Agency">
<meta property="og:description" content="One brand. Every market. No weak links. Request a free marketing audit.">
<meta property="og:image" content="https://dispatchco.io/assets/og-image.png">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#FAFAFA;--ink:#111111;--body:#444444;--muted:#555555;--line:#E5E5E5;--white:#FFFFFF}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,-apple-system,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .wrap{max-width:1200px;margin:0 auto;padding-left:clamp(20px,5vw,64px);padding-right:clamp(20px,5vw,64px)}
  .skip{position:absolute;left:-999px}.skip:focus{left:16px;top:16px;background:#fff;padding:8px 12px;z-index:10}
  /* header */
  header{position:sticky;top:0;z-index:5;background:rgba(250,250,250,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:16px 32px;padding-top:16px;padding-bottom:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none}
  .brand span{font-size:24px;font-weight:300;letter-spacing:-.03em}
  .links{display:flex;align-items:center;flex-wrap:wrap;gap:8px 28px;font-size:15px}
  .links a{text-decoration:none;color:#333}
  .links a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
  .btn{display:inline-block;text-decoration:none;border-radius:999px;padding:15px 26px;font-size:16px;font-weight:500;line-height:1;border:1px solid var(--ink);cursor:pointer;font-family:inherit;transition:opacity .15s}
  .btn:hover{opacity:.85}
  .btn-primary{background:var(--ink);color:var(--white)!important}
  .btn-secondary{background:transparent;color:var(--ink)}
  .links .btn{padding:12px 20px;font-size:15px}
  @media (max-width:860px){.links a:not(.btn){display:none}}
  /* type */
  .eyebrow{margin:8px 0 0;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  h1{margin:0;font-size:clamp(46px,8vw,104px);font-weight:300;letter-spacing:-.045em;line-height:1.02;max-width:1000px}
  h2{margin:0;font-size:clamp(34px,5vw,60px);font-weight:300;letter-spacing:-.035em;line-height:1.08}
  .intro{margin:24px 0 0;max-width:580px;font-size:18px;line-height:1.6;color:var(--body)}
  p{line-height:1.6}
  /* sections */
  section{scroll-margin-top:80px}
  .hero{padding-top:clamp(72px,12vw,160px);padding-bottom:clamp(72px,10vw,140px)}
  .hero .eyebrow{margin:0 0 28px}
  .hero-row{margin-top:48px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:32px}
  .hero-row p{margin:0;max-width:520px;font-size:clamp(17px,1.6vw,20px);color:var(--body)}
  .actions{display:flex;flex-wrap:wrap;gap:12px}
  .band{border-top:1px solid var(--line)}
  .split{display:flex;flex-wrap:wrap;gap:24px 48px;padding-top:clamp(72px,9vw,128px);padding-bottom:clamp(72px,9vw,128px)}
  .split > .eyebrow{flex:1 1 180px}
  .split > .body{flex:999 1 560px;min-width:0}
  .cards{margin-top:56px;display:flex;flex-wrap:wrap;border:1px solid #E0E0E0;border-radius:6px;background:var(--white)}
  .card{flex:1 1 240px;padding:32px 28px;border-right:1px solid #E0E0E0}
  .card:last-child{border-right:0}
  @media (max-width:800px){.card{border-right:0;border-bottom:1px solid #E0E0E0}.card:last-child{border-bottom:0}}
  h3{margin:0;font-size:22px;font-weight:500;letter-spacing:-.02em}
  .card p,.item p{margin:14px 0 0;font-size:16px;color:var(--body)}
  .services{margin-top:64px;border-top:1px solid #DDD;list-style:none;padding:0}
  .services li{display:flex;flex-wrap:wrap;gap:8px 32px;padding:28px 0;border-bottom:1px solid #DDD}
  .services .num{flex:0 0 48px;font-size:13px;color:var(--muted);padding-top:8px}
  .services h3{flex:1 1 280px;font-size:clamp(22px,2.4vw,30px);font-weight:300;letter-spacing:-.025em}
  .services p{flex:1 1 340px;margin:0;font-size:16px;color:var(--body)}
  .dark{background:var(--ink);color:#F5F5F5}
  .dark .eyebrow{color:#B8B8B8}
  .dark h2{color:#fff}
  .dark .lead{margin:36px 0 0;max-width:640px;font-size:clamp(18px,1.8vw,22px);color:#E6E6E6}
  .pills{margin-top:40px;display:flex;flex-wrap:wrap;gap:10px;list-style:none;padding:0}
  .pills li{border:1px solid #555;border-radius:999px;padding:9px 16px;font-size:14px;color:#E6E6E6}
  .items{margin-top:56px;display:flex;flex-wrap:wrap;gap:40px 48px}
  .item{flex:1 1 260px;border-top:1px solid var(--ink);padding-top:20px}
  .item h3{font-size:20px;letter-spacing:-.015em}
  .about p{margin:32px 0 0;max-width:660px;font-size:clamp(18px,1.7vw,20px);line-height:1.65;color:var(--body)}
  /* form */
  form{margin-top:48px;max-width:780px;display:flex;flex-wrap:wrap;gap:28px 32px}
  label{flex:1 1 300px;display:flex;flex-direction:column;gap:8px;font-size:14px;color:#333}
  label.full{flex-basis:100%}
  input,select,textarea{border:0;border-bottom:1px solid #BBB;background:transparent;padding:10px 0;font-family:inherit;font-size:16px;color:var(--ink);border-radius:0}
  input:focus,select:focus,textarea:focus{outline:none;border-bottom-color:var(--ink)}
  textarea{resize:vertical}
  .hp{display:none}
  .form-note{flex-basis:100%;margin:0;font-size:13px;color:var(--muted)}
  /* footer */
  footer{background:var(--ink);color:#E6E6E6}
  .foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px 32px;padding-top:40px;padding-bottom:40px}
  .foot .brand{color:#fff}
  .foot .brand span{font-size:20px}
  .foot p{margin:0;font-size:14px;color:#B8B8B8}
  .foot nav{display:flex;flex-wrap:wrap;gap:8px 24px;font-size:14px}
  .foot nav a{text-decoration:none;color:#E6E6E6}
  .foot nav a:hover{text-decoration:underline}
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #2F6FEB;outline-offset:3px}
</style>
<meta name="robots" content="noindex">
</head>

      <span>dispatch.</span></a><nav class="links" aria-label="Main"><a class="btn btn-primary" href="index.html#contact">Request a free audit</a></nav></div></header>
<main class="wrap" style="padding-top:clamp(72px,10vw,140px);padding-bottom:clamp(72px,10vw,140px);max-width:860px">
<h1 style="font-size:clamp(40px,6vw,72px)">Thanks. We're on it.</h1>
<p class="intro">Your audit request is in. We'll review what you sent and get back to you shortly with next steps.</p>
<p style="margin-top:40px"><a class="btn btn-secondary" href="index.html">Back to home</a></p>
</main>
<footer><div class="wrap foot"><p>© 2026 dispatch. · An independent franchise and multi-location marketing agency.</p></div></footer>
</body></html>
